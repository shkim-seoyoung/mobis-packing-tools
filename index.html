<style>
*{box-sizing:border-box}body{margin:0;font:14px "Malgun Gothic",Arial,sans-serif;background:#f0f3f7;color:#192a40}
header{height:64px;background:white;border-bottom:1px solid #dce3ed;display:flex;align-items:center;gap:18px;padding:0 26px}

.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{background:white;border:1px solid #d9e1eb;border-radius:13px;padding:24px 20px;min-height:175px;text-align:left;cursor:pointer;box-shadow:0 2px 9px #1e293b09}
.card:hover:not(:disabled){border-color:#2860b0;box-shadow:0 4px 17px #2563eb17}
.card strong{display:block;font-size:17px;margin:12px 0 9px}.card span{color:#68778b;line-height:1.65;font-size:13px}
.card:disabled{cursor:default;opacity:.57}
.symbol{font-size:27px}
#workspace{display:none;height:calc(100vh - 64px)}
#loginStage{position:fixed;inset:0;background:#f0f3f7;z-index:20;display:block}
#loginFrame{border:0;width:100%;height:100%;background:#fff}
#account{margin-left:auto;display:none;align-items:center;gap:8px;font-size:12px;color:#475569}
#globalLogout{border:1px solid #cbd5e1;border-radius:7px;background:white;padding:8px 11px;cursor:pointer}
body:not(.logged-in) header{display:none}
body:not(.logged-in) #menu,body:not(.logged-in) #workspace{display:none!important}
body.logged-in #loginStage{top:64px;z-index:5}
body.logged-in.qr-scan-mode #loginStage{top:64px}
body.logged-in #loginStage .editor-frame{height:100%!important}
.editor-frame{display:none;border:0;width:100%;height:100%;background:#fff}
@media(max-width:720px){.cards{grid-template-columns:1fr}#menu{margin:32px auto}header{padding:0 15px}}
@media print{header,#menu{display:none!important}#workspace{height:auto!important}}
@media(max-width:800px){body.qr-scan-mode>header{display:flex!important}body.qr-scan-mode #workspace{height:calc(100dvh - 64px)!important}body.qr-scan-mode .editor-frame{height:100%!important}}

const labels={ct:"C/T 작업지시서 편집",label:"MOBIS 부품식별표 편집",qr:"QR 적입 검증"};
const frames={ct:document.getElementById("ctFrame"),label:document.getElementById("labelFrame"),qr:document.getElementById("qrFrame")};
const loaded={ct:false,label:false,qr:false};
let qrDraft=null;
let qrPdfDocs=null;
let parentRole="";
function applyRoleAccess(){
 const authenticated=parentRole==="ADMIN"||parentRole==="USER";
 document.body.classList.toggle("logged-in",authenticated);
 document.getElementById("loginStage").style.display=(!authenticated||document.getElementById("workspace").dataset.active==="qr")?"block":"none";
 document.getElementById("account").style.display=authenticated?"flex":"none";
 document.getElementById("roleLabel").textContent=parentRole;
 document.querySelectorAll('[data-editor]').forEach(b=>b.style.display=parentRole==="ADMIN"||b.dataset.editor==="qr"?"":"none");
 document.getElementById("back").style.display=authenticated&&document.getElementById("workspace").style.display==="block"?"inline-block":"none";
 document.getElementById("menu").style.display=authenticated&&document.getElementById("workspace").style.display==="none"?"block":"none";
}
window.addEventListener("message",e=>{if(e.source!==frames.qr.contentWindow||!e.data||e.data.type!=="mobis-qr-view-v1")return;document.body.classList.toggle("qr-scan-mode",e.data.view==="scan")});
window.addEventListener("message",e=>{if(e.source!==frames.qr.contentWindow||!e.data||e.data.type!=="mobis-qr-role-v1")return;parentRole=e.data.role==="ADMIN"?"ADMIN":e.data.role==="USER"?"USER":"";if(parentRole)navigate(null);else navigate(null);applyRoleAccess()});
window.addEventListener("message",e=>{if(e.source!==frames.ct.contentWindow||!e.data||e.data.type!=="mobis-qr-draft-v1")return;const p=e.data.payload;if(!p||!Array.isArray(p.cases))return;if(Array.isArray(e.data.pdfDocs)&&e.data.pdfDocs.length){qrPdfDocs=e.data.pdfDocs;const known=new Set(qrPdfDocs.flatMap(d=>d.rows.map(r=>r.no)));const extras=(e.data.editedRows||[]).filter(r=>!known.has(r.no));if(extras.length)qrPdfDocs[0].rows.push(...extras)}
 qrDraft={wi:String(p.wi||""),ct:String(p.ct||""),cases:p.cases.map(String)};navigate("qr");setTimeout(()=>frames.qr.contentWindow.postMessage({type:"mobis-qr-fill-v1",payload:qrDraft},"*"),120)});
window.addEventListener("message",e=>{
 if(e.source!==frames.qr.contentWindow||parentRole!=="ADMIN"||!e.data)return;
 if(e.data.type!=="mobis-ct-open-v1"&&e.data.type!=="mobis-ct-open-pdfs-v1")return;
 const pdfs=e.data.type==="mobis-ct-open-pdfs-v1"?Array.from(e.data.files||[]):[];
 if(pdfs.length){
  if(!loaded.ct){frames.ct.addEventListener("load",()=>frames.ct.contentWindow.postMessage({type:"mobis-ct-pdfs-v1",files:pdfs},"*"),{once:true});navigate("ct")}
  else {navigate("ct");frames.ct.contentWindow.postMessage({type:"mobis-ct-pdfs-v1",files:pdfs},"*")}
 }else {
  const payload={...(e.data.payload||{wi:"",ct:"",cases:[]}),pdfDocs:qrPdfDocs};
  if(!loaded.ct){frames.ct.addEventListener("load",()=>frames.ct.contentWindow.postMessage({type:"mobis-ct-qr-current-v1",payload},"*"),{once:true});navigate("ct")}
  else {navigate("ct");frames.ct.contentWindow.postMessage({type:"mobis-ct-qr-current-v1",payload},"*")}
 }
});
window.addEventListener('message',e=>{if(e.source===frames.qr.contentWindow&&e.data?.type==='mobis-qr-clear-pdf-v1')qrPdfDocs=null});
let pdfExtractSequence=0;
window.addEventListener('message',e=>{
 if(e.source!==frames.qr.contentWindow||parentRole!=='ADMIN'||!e.data||e.data.type!=='mobis-qr-extract-pdfs-v1')return;
 const files=Array.from(e.data.files||[]);if(!files.length)return;
 const requestId=++pdfExtractSequence;
 const send=()=>frames.ct.contentWindow.postMessage({type:'mobis-ct-extract-only-v1',requestId,files},'*');
 if(!loaded.ct){frames.ct.addEventListener('load',send,{once:true});
   // iframe source is initialized without changing the visible page
   loaded.ct=true;frames.ct.srcdoc=decodeHTML(contents.ct);
 }else send();
});
window.addEventListener('message',e=>{
 if(e.source!==frames.ct.contentWindow||!e.data||e.data.type!=='mobis-ct-extracted-v1')return;
 if(e.data.requestId!==pdfExtractSequence)return;
 if(e.data.payload&&Array.isArray(e.data.payload.pdfDocs))qrPdfDocs=e.data.payload.pdfDocs;
 frames.qr.contentWindow.postMessage({type:'mobis-qr-pdf-result-v1',payload:e.data.payload,errors:e.data.errors||[]},'*');
});
function decodeHTML(data){const binary=atob(data);const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));return new TextDecoder("utf-8").decode(bytes)}
function navigate(target){
 if(parentRole!=="ADMIN" && target!=="qr" && target!==null)target=null;
 const active=target==="ct"||target==="label"||target==="qr"?target:null;
 document.getElementById("menu").style.display=active?"none":"block";
 document.getElementById("workspace").style.display=active?"block":"none";
 document.getElementById("back").style.display=active?"inline-block":"none";
 document.getElementById("appTitle").textContent=active?labels[active]:"MOBIS 포장작업 통합도구";
 for(const key of Object.keys(frames))frames[key].style.display=(key===active || (key==="qr" && !parentRole))?"block":"none";
 document.getElementById("workspace").dataset.active=active||"";
 if(active&&!loaded[active]){loaded[active]=true;frames[active].srcdoc=decodeHTML(contents[active])}
 applyRoleAccess();
}
document.querySelectorAll("[data-editor]").forEach(button=>button.addEventListener("click",()=>navigate(button.dataset.editor)));
document.getElementById("back").addEventListener("click",()=>navigate(null));
document.getElementById("globalLogout").addEventListener("click",()=>{
 const logout=frames.qr.contentDocument?.getElementById("logout");
 if(logout)logout.click();else alert("QR 검증 화면에서 로그아웃한 뒤 다시 시도해 주세요.");
});
// Authentication is performed by the existing QR application, sharing its Supabase session.
// It is displayed as the entry screen until a validated ADMIN/USER role is reported.
loaded.qr=true;
frames.qr.srcdoc=decodeHTML(contents.qr);
// Keep the QR authentication iframe permanently mounted. Moving a live iframe
// between containers reloads its document and can trigger a logout/login loop.
const loginStage=document.getElementById("loginStage");
loginStage.appendChild(frames.qr);
frames.qr.style.display="block";
frames.qr.style.height="100%";
navigate(null);
</script></body></html>
