const labels={ct:"C/T 작업지시서 편집",label:"MOBIS 부품식별표 편집",qr:"QR 적입 검증"};
const frames={ct:document.getElementById("ctFrame"),label:document.getElementById("labelFrame"),qr:document.getElementById("qrFrame")};
const loaded={ct:false,label:false,qr:false};
let qrDraft=null;
let parentRole="";
function applyRoleAccess(){const admin=parentRole==="ADMIN";document.getElementById("back").style.display=admin&&document.getElementById("workspace").style.display==="block"?"inline-block":"none";document.getElementById("menu").style.display=admin&&document.getElementById("workspace").style.display==="none"?"block":"none";}
window.addEventListener("message",e=>{if(e.source!==frames.qr.contentWindow||!e.data||e.data.type!=="mobis-qr-role-v1")return;parentRole=e.data.role==="ADMIN"?"ADMIN":e.data.role==="USER"?"USER":"";if(parentRole!=="ADMIN")navigate("qr");applyRoleAccess()});
window.addEventListener("message",e=>{if(e.source!==frames.ct.contentWindow||!e.data||e.data.type!=="mobis-qr-draft-v1")return;const p=e.data.payload;if(!p||!Array.isArray(p.cases))return;qrDraft={wi:String(p.wi||""),ct:String(p.ct||""),cases:p.cases.map(String)};navigate("qr");setTimeout(()=>frames.qr.contentWindow.postMessage({type:"mobis-qr-fill-v1",payload:qrDraft},"*"),120)});
function decodeHTML(data){const binary=atob(data);const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));return new TextDecoder("utf-8").decode(bytes)}
function navigate(target){
 if(parentRole!=="ADMIN" && target!=="qr")target="qr";
 const active=target==="ct"||target==="label"||target==="qr"?target:null;
 document.getElementById("menu").style.display=active?"none":"block";
 document.getElementById("workspace").style.display=active?"block":"none";
 document.getElementById("back").style.display=active?"inline-block":"none";
 document.getElementById("appTitle").textContent=active?labels[active]:"MOBIS 포장작업 편집 도구";
 for(const key of Object.keys(frames))frames[key].style.display=key===active?"block":"none";
 if(active&&!loaded[active]){loaded[active]=true;frames[active].srcdoc=decodeHTML(contents[active])}
 applyRoleAccess();
}
document.querySelectorAll("[data-editor]").forEach(button=>button.addEventListener("click",()=>navigate(button.dataset.editor)));
document.getElementById("back").addEventListener("click",()=>navigate(null));
navigate("qr");
</script></body></html>
